# =============================================================================
# llmcord Configuration File
# =============================================================================
# This file shows the NEW grouped config structure. The old flat keys are
# still supported for backward compatibility, but we recommend the new format.
#
# New structure groups settings into sections:
#   • discord    - Discord bot settings (token, client ID, status, permissions)
#   • behavior   - Bot behavior settings (message limits, responses, DM settings)
#   • llm        - LLM provider and model configuration
#   • tools      - Tool configurations (web_search, google_tools, etc.)
#   • voice      - Voice (TTS/STT) configuration
#   • portal     - Web portal settings
# =============================================================================

# =============================================================================
# Discord Settings
# =============================================================================
discord:
  bot_token: 
  client_id: 
  status_message: 
  permissions:
    users:
      admin_ids: []
      allowed_ids: []
      blocked_ids: []

    roles:
      allowed_ids: []
      blocked_ids: []

    channels:
      allowed_ids: []
      blocked_ids: []

# =============================================================================
# Bot Behavior Settings
# =============================================================================
behavior:
  max_text: 100000
  max_images: 5
  max_messages: 25
  use_plain_responses: false
  show_embed_color: true
  allow_dms: true
  # Log level: TRACE, DEBUG, INFO, WARNING, ERROR, CRITICAL
  # Optional: defaults to DEBUG in development, INFO in production
  # Can be overridden by LOG_LEVEL environment variable
  # log_level: INFO

# =============================================================================
# LLM Settings
# =============================================================================
llm:
  providers:
    # Remote providers:
    azure-openai:
      base_url: https://<resource name>.openai.azure.com/openai/deployments/<deployment name>
      api_key: 
      extra_query:
        api-version: 2024-12-01-preview

    google:
      base_url: https://generativelanguage.googleapis.com/v1beta/openai
      api_key: 

    groq:
      base_url: https://api.groq.com/openai/v1
      api_key: 

    mistral:
      base_url: https://api.mistral.ai/v1
      api_key: 

    openai:
      base_url: https://api.openai.com/v1
      api_key: 

    openrouter:
      base_url: https://openrouter.ai/api/v1
      api_key: 

    x-ai:
      base_url: https://api.x.ai/v1
      api_key: 

    # Local providers:
    lmstudio:
      base_url: http://localhost:1234/v1

    ollama:
      base_url: http://localhost:11434

    vllm:
      base_url: http://localhost:8000/v1

    open-webui:
      base_url: http://localhost:3000/api
      api_key: 
      enable_web_search: true

  models:
    openrouter/openrouter/free:
      persona: discord-bot
      supports_tools: true
      tools: ["web_search"]
      think: true

    # ollama/qwen3:14b:
    #   tools: ["web_search", "visuals_core"]
    #   persona: some_persona_name
    #   think: true

  fallback_models:
    # - "ollama/llama2"
    # - "groq/mixtral"

# =============================================================================
# Scheduled Tasks
# =============================================================================
# Two ways to configure tasks:
# 1) Inline under `scheduled_tasks` (legacy style)
# 2) Recommended: create YAML files under `bot/config/tasks/*.yaml`

scheduled_tasks:
  # Cron: minute hour day month day_of_week
  email_check:
    enabled: false
    cron: "0 9 * * *"
    channel_id: xxxxxxxx
    model: "google/gemini-2.5-flash"
    fallback_models:
      - "openrouter/openrouter/free"
    prompt: "Summarize my recent emails"
    system_prompt: |
      Reply in Traditional Chinese. Focus on major indices only.

  DM_MSG:
    enabled: false
    cron: "0 * * * *"
    user_id: xxxxxx
    model: "google/gemini-2.5-flash"
    fallback_models:
      - "openrouter/openrouter/free"
    prompt: "how are you? this is a test msg."

# =============================================================================
# Tools Configuration
# =============================================================================
tools:
  # Web search uses Brave API. Set BRAVE_API_KEY in .env

  google_tools:
    default_calendar_entries: 10
    default_email_entries: 10
    path_to_credentials: "credentials.json"

# =============================================================================
# Voice Configuration (TTS/STT)
# =============================================================================
voice:
  # Azure Speech Services - get credentials at https://portal.azure.com
  # key: ""
  # region: "eastus"
  # endpoint: ""
  # default_voice: "en-US-JennyNeural"
  # default_style: "cheerful"

# =============================================================================
# Web Portal Configuration
# =============================================================================
portal:
  enabled: false
  port: ${PORT:8080}
  password: ${PORTAL_PASSWORD:}
  logs:
    retention_days: 7
    # Log levels to capture in portal database: INFO, WARNING, ERROR
    # NOTE: DEBUG causes massive I/O from SQLAlchemy - only enable temporarily!
    levels: [INFO, WARNING, ERROR]
  # require_discord_admin: true

# =============================================================================
# LEGACY FORMAT (Backward Compatible - Deprecated)
# =============================================================================
# Old flat keys still work but are deprecated. Migrate to grouped format above.
